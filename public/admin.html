<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember & Spice — Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>:root{--ink:#1d1915;--paper:#f6f0e7;--rust:#ad4c2d;--line:#ddd2c5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}.wrap{max-width:1200px;margin:auto;padding:40px 24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.head h1{font:42px 'Playfair Display';margin:0}.card{background:#fff;border:1px solid var(--line);padding:22px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat b{font:30px 'Playfair Display';display:block;margin-top:5px}.login{max-width:420px;margin:12vh auto}.input{width:100%;padding:12px;margin:7px 0 15px;border:1px solid var(--line);font:inherit}button{background:var(--ink);color:#fff;border:0;padding:11px 16px;cursor:pointer}.hidden{display:none}.row{display:flex;gap:15px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:15px 0}.pill{padding:4px 8px;background:#eee4d8;font-size:11px}.actions button{margin-left:4px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{background:var(--rust)}.panel{display:none}.panel.active{display:block}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.formgrid .wide{grid-column:span 2}.thumb{width:54px;height:45px;object-fit:cover;vertical-align:middle;margin-right:8px}@media(max-width:800px){.stats,.formgrid{grid-template-columns:1fr}.row{display:block}.actions{margin-top:10px}.formgrid .wide{grid-column:span 1}}
</style></head><body><div id="login" class="wrap login"><div class="card"><h1>Admin</h1><p>Ember & Spice management dashboard</p><input id="email" class="input" value="admin@emberandspice.com"><input id="password" class="input" type="password" value="admin123"><button onclick="login()">Sign in</button><p id="loginMsg"></p></div></div><div id="app" class="wrap hidden"><div class="head"><div><div style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ad4c2d">Ember & Spice</div><h1>Management Dashboard</h1></div><div><a href="/" style="margin-right:15px;color:#1d1915">View site</a><button onclick="logout()">Log out</button></div></div><div id="stats" class="stats"></div><div id="orderBreakdown" class="card" style="margin-top:14px"></div><div class="tabs"><button class="active" onclick="tab('overview',this)">Overview</button><button onclick="tab('orders',this)">Orders</button><button onclick="tab('reservations',this)">Reservations</button><button onclick="tab('menu',this)">Menu</button><button onclick="tab('messages',this)">Messages</button><button onclick="tab('reviews',this)">Reviews</button></div><section id="overview" class="panel active"><div class="card"><h2>Recent activity</h2><div id="overviewList"></div></div></section><section id="orders" class="panel"><div class="card"><h2>Orders</h2><div id="ordersList"></div></div></section><section id="reservations" class="panel"><div class="card"><h2>Reservations</h2><div id="reservationsList"></div></div></section><section id="menu" class="panel"><div class="card"><h2>Add menu item</h2><form id="menuForm" class="formgrid"><input class="input" name="name" placeholder="Dish name" required><input class="input" name="category" placeholder="Category" required><input class="input" name="price" type="number" placeholder="Price" required><input class="input wide" name="description" placeholder="Description" required><input class="input" name="tag" placeholder="Tag"><input class="input wide" name="image" placeholder="Image URL"><button>Add dish</button></form></div><div class="card"><h2>Current menu</h2><div id="menuList"></div></div></section><section id="messages" class="panel"><div class="card"><h2>Customer messages</h2><div id="messagesList"></div></div></section><section id="reviews" class="panel"><div class="card"><h2>Add guest review</h2><form id="reviewForm" class="formgrid"><input class="input" name="name" placeholder="Guest name" required><input class="input" name="rating" type="number" min="1" max="5" value="5" required><input class="input wide" name="comment" placeholder="Review" required><button>Add review</button></form></div><div class="card"><h2>Reviews</h2><div id="reviewsList"></div></div></section></div><script>let token=localStorage.getItem('emberToken');const $=id=>document.getElementById(id);let cache=null;async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok){$('loginMsg').textContent=j.error;return}token=j.token;localStorage.setItem('emberToken',token);show()}function logout(){localStorage.removeItem('emberToken');location.reload()}function tab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');btn.classList.add('active')}async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opts);if(r.status===401){logout();return null}return r.json()}async function load(){cache=await api('/api/admin/dashboard');if(!cache)return;const s=cache.stats;$('stats').innerHTML=`<div class="card stat"><span>Reservations</span><b>${s.reservations}</b></div><div class="card stat"><span>Orders</span><b>${s.orders}</b></div><div class="card stat"><span>Pending orders</span><b>${s.pendingOrders}</b></div><div class="card stat"><span>Menu items</span><b>${s.menuItems}</b></div><div class="card stat"><span>Revenue</span><b>₹${Number(s.revenue).toLocaleString('en-IN')}</b></div>`;const counts=cache.orders.reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});$('orderBreakdown').innerHTML='<h2 style="margin-top:0">Live order overview</h2><p><b>All:</b> '+cache.orders.length+' &nbsp; <b>Pending:</b> '+(counts.Pending||0)+' &nbsp; <b>Preparing:</b> '+(counts.Preparing||0)+' &nbsp; <b>Ready:</b> '+(counts.Ready||0)+' &nbsp; <b>Completed:</b> '+(counts.Completed||0)+' &nbsp; <b>Cancelled:</b> '+(counts.Cancelled||0)+'</p>';$('ordersList').innerHTML=cache.orders.length?cache.orders.map(x=>`<div class="row"><div><b>${x.id}</b> · ${x.customer} · ${x.phone}<br><b>${x.items.reduce((n,i)=>n+i.qty,0)} item(s)</b> · ${x.items.map(i=>i.name+' × '+i.qty).join(', ')}<br><small>${x.address} · ${x.paymentMethod} · ₹${Number(x.total).toLocaleString('en-IN')}</small></div><div class="actions"><span class="pill">${x.status}</span> <button onclick="orderStatus('${x.id}','Confirmed')">Confirm</button> <button onclick="orderStatus('${x.id}','Preparing')">Preparing</button> <button onclick="orderStatus('${x.id}','Ready')">Ready</button> <button onclick="orderStatus('${x.id}','Completed')">Complete</button> <button onclick="orderStatus('${x.id}','Cancelled')">Cancel</button><br><a target="_blank" href="https://wa.me/91${x.phone.replace(/\D/g,'')}" style="font-size:11px">WhatsApp customer</a></div></div>`).join(''):'<p>No orders yet.</p>';$('reservationsList').innerHTML=cache.reservations.length?cache.reservations.map(x=>`<div class="row"><div><b>${x.name}</b> · ${x.guests} guests · ${x.phone}<br>${x.date} at ${x.time} · ${x.occasion}<br><small>${x.message||''}</small></div><div class="actions"><span class="pill">${x.status}</span> <button onclick="reservationStatus('${x.id}','Confirmed')">Confirm</button> <button onclick="reservationStatus('${x.id}','Cancelled')">Cancel</button></div></div>`).join(''):'<p>No reservations yet.</p>';$('menuList').innerHTML=cache.menu.map(x=>`<div class="row"><div><img class="thumb" src="${x.image}"><b>${x.name}</b> · ${x.category} · ₹${x.price}<br>${x.description}</div><button onclick="delDish(${x.id})">Delete</button></div>`).join('');$('messagesList').innerHTML=cache.messages.length?cache.messages.map(x=>`<div class="row"><div><b>${x.name}</b> · ${x.email}<br>${x.message}</div><div><span class="pill">${x.status}</span> <button onclick="messageStatus('${x.id}','Read')">Mark read</button></div></div>`).join(''):'<p>No messages yet.</p>';$('reviewsList').innerHTML=cache.reviews.map(x=>`<div class="row"><div><b>${x.name}</b> · ${'★'.repeat(x.rating)}<br>${x.comment}</div><button onclick="delReview(${x.id})">Delete</button></div>`).join('');$('overviewList').innerHTML=[...cache.orders.slice(0,3).map(x=>`<div class="row"><div>Order <b>${x.id}</b> from ${x.customer}</div><span class="pill">${x.status}</span></div>`),...cache.reservations.slice(0,3).map(x=>`<div class="row"><div>Reservation for <b>${x.name}</b> on ${x.date} at ${x.time}</div><span class="pill">${x.status}</span></div>`)].join('')||'<p>No activity yet.</p>'}async function orderStatus(id,status){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function reservationStatus(id,status){await api('/api/admin/reservations/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function messageStatus(id,status){await api('/api/admin/messages/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function delDish(id){await api('/api/admin/menu/'+id,{method:'DELETE'});load()}async function delReview(id){await api('/api/admin/reviews/'+id,{method:'DELETE'});load()}$('menuForm').addEventListener('submit',async e=>{e.preventDefault();await api('/api/admin/menu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()});$('reviewForm').addEventListener('submit',async e=>{e.preventDefault();await api('/api/admin/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()});function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}if(token)show()</script></body></html>
